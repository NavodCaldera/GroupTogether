# Project-local servers use pinned packages from package-lock.json; no runtime npx downloads.
[mcp_servers.groupbasket-next-devtools]
command = "node"
args = ["node_modules/next-devtools-mcp/dist/index.js"]
enabled_tools = ["nextjs_index", "nextjs_call", "nextjs_docs"]
startup_timeout_sec = 20

[mcp_servers.groupbasket-postgres-read-only]
command = "node"
args = ["scripts/postgres-inspector.mjs"]
enabled_tools = ["query"]
startup_timeout_sec = 20
# Local reader was provisioned and verified; other clones must run reader setup first.
enabled = true

[mcp_servers.groupbasket-context7]
command = "node"
args = ["node_modules/@upstash/context7-mcp/dist/index.js"]
env_vars = ["CONTEXT7_API_KEY"]
enabled_tools = ["resolve-library-id", "query-docs"]
startup_timeout_sec = 20
# Optional remote documentation lookup; send library questions, never private records.
enabled = false
