# Local servers use pinned packages; Context7 uses its official hosted endpoint.
[mcp_servers.groupbasket-next-devtools]
command = "node"
args = ["node_modules/next-devtools-mcp/dist/index.js"]
enabled_tools = ["nextjs_index", "nextjs_call", "nextjs_docs"]
startup_timeout_sec = 20

[mcp_servers.groupbasket-postgres-read-only]
command = "node"
args = ["scripts/postgres-inspector.mjs"]
enabled_tools = ["query"]
startup_timeout_sec = 20
# Local reader was provisioned and verified; other clones must run reader setup first.
enabled = true

[mcp_servers.groupbasket-context7]
url = "https://mcp.context7.com/mcp"
enabled_tools = ["resolve-library-id", "query-docs"]
startup_timeout_sec = 20
# Public documentation only; verified without an API key. Account quotas may differ.
enabled = true
# For account-specific quota, set CONTEXT7_API_KEY and uncomment:
# bearer_token_env_var = "CONTEXT7_API_KEY"
